# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Homebrew test-bot cleanup
        run: brew test-bot --only-cleanup-before

      - name: Homebrew test-bot setup
        run: brew test-bot --only-setup

      - name: Homebrew test-bot syntax
        run: brew test-bot --only-tap-syntax

      - name: Homebrew test-bot formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Check target OS
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: ./scripts/check_os.sh "$TAP_NAME"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ runner.os }}
          path: '*.bottle.*'
