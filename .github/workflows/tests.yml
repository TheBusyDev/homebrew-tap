# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Install, Test, and Audit Formulae (Skip Linkage)
        if: github.event_name == 'pull_request'
        run: |
          cd "$(brew --repo ${{ github.repository }})"
          shopt -s nullglob # Prevent the loop from running on a literal string if no files exist.

          # Loop through all formulae in the tap.
          for file in Formula/*.rb; do
            formula=$(basename "$file" .rb)
            full_formula="${{ github.repository }}/$formula"
            echo "=== Processing $formula ==="

            echo "-> Installing $formula..."
            brew install "$full_formula"

            echo "-> Testing $formula..."
            brew test "$full_formula"

            echo "-> Auditing $formula..."
            brew audit --strict "$full_formula"
          done